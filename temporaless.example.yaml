# HTTP control plane.
server:
  listen: 127.0.0.1:8080
  read_header_timeout: 5s
  read_timeout: 15s
  idle_timeout: 1m
  shutdown_timeout: 10s

# SQLite stores service specs and revision history.
registry:
  path: /tmp/temporaless-quickstart.db

# Temporal Frontend connection and startup reconciliation deadline.
temporal:
  address: localhost:7233
  namespace: default
  startup_timeout: 2m

# Worker revision switching, drainage, and per-service concurrency.
worker:
  switch_timeout: 30s
  stop_timeout: 30s
  max_concurrent_activities_per_service: 32
  max_concurrent_activity_task_pollers: 32

# Shared HTTP client limits.
http:
  max_backend_response_bytes: 1048576
  max_idle_connections_per_host: 32

# Optional Prometheus scrape endpoint. Set listen to "" to disable it.
observability:
  metrics:
    listen: 127.0.0.1:9090
